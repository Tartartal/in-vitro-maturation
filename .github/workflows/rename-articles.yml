name: Rename articles to headings

on:
  schedule:
    # Every day at 06:00 UTC. Already renamed articles are skipped by the script.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test rename script
        run: python -m unittest scripts.test_rename_articles -v

      - name: Rename articles to their headings
        run: python scripts/rename_articles.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new articles to rename."
            exit 0
          fi
          git commit -m "Rename articles to the titles in their headings"
          git push
